services:
  - type: web
    name: streamyflix-bot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: streamyflix
      - key: MONGO_COLLECTION
        value: files
      - key: ADMIN_API_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBSITE_URL
        sync: false
      - key: FORCE_SUB_LINK
        sync: false
      - key: PORT
        value: "3001"
